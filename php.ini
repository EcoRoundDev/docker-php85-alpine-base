; ============================================================
; PHP 8.5 生产安全基线 —— writing/php85-alpine-base
; 设计依据：docs/php85-docker-image-design.md 第 6 节
; 挂载点：/usr/local/etc/php/conf.d/zzz_custom.ini
; 文件名以 zzz 开头，保证在 docker-php-ext-*.ini 之后加载
; ============================================================

; ---------- 信息暴露 ----------
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED

; ---------- 资源上限 ----------
memory_limit = 512M
upload_max_filesize = 20M
post_max_size = 24M
max_execution_time = 30
max_input_time = 60

; ---------- 时区与文件缓存 ----------
date.timezone = Asia/Shanghai
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; ---------- OPcache ----------
; Octane 是常驻 CLI 进程，enable_cli 必须开，否则 opcache 完全不生效
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 32531
; 镜像内代码不可变：不做 stat 校验。改代码必须重建镜像
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.revalidate_freq = 0

; ---------- 安全基线 ----------
zend.exception_ignore_args = On
zend.assertions = -1
allow_url_include = Off
allow_url_fopen = Off
cgi.fix_pathinfo = 0
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax

; Swoole：禁用全局短函数名（go/co 等），避免污染命名空间
swoole.use_shortname = Off

; 禁用危险函数。
; 注意：**必须保留 exec** —— Octane 停机时 vendor/laravel/octane/src/Exec.php:15
; 用 exec('pgrep -P ...') 找子进程，禁用后 SIGTERM 阶段会抛
; "Call to undefined function Laravel\Octane\exec()"；
; **保留 proc_open** 供 Symfony Process 使用。
disable_functions = shell_exec,system,passthru,popen,phpinfo
